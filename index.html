<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Tic Tac Toe</h1>

    <div id="game">

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

    </div>

    <h2 id="status">Player X's Turn</h2>


    <!-- SCOREBOARD -->

    <div class="scoreboard">

        <div>
            <h3>Player X</h3>
            <p id="scoreX">0</p>
        </div>

        <div>
            <h3>Draws</h3>
            <p id="scoreDraw">0</p>
        </div>

        <div>
            <h3>Player O</h3>
            <p id="scoreO">0</p>
        </div>

    </div>


    <!-- RESTART BUTTON -->

    <button onclick="restartGame()">Restart Game</button>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
